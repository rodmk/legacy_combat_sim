[package]
name = "legacy-combat-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Combat simulation tools for Legacy"
readme = "README.md"
repository = "https://github.com/rodmk/legacy_combat_sim"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "0.56", default-features = false }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
