[package]
name = "legacy-combat-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Combat simulation tools for Legacy"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
